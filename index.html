<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Follow-Up Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#1b2733;--muted:#5d6b7a;--line:#d9e0e8;--accent:#1f4e78;--accentText:#fff;--danger:#b42318;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#18212b;--text:#e8eef4;--muted:#9aa8b6;--line:#2c3947;--accent:#5aa2dc;--accentText:#08121c;--danger:#f97066;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161d;--card:#18212b;--text:#e8eef4;--muted:#9aa8b6;--line:#2c3947;--accent:#5aa2dc;--accentText:#08121c;--danger:#f97066;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:15px}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:6px;padding:9px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--accentText)}
button.ghost{background:transparent;color:var(--accent)}
button.del{background:transparent;color:var(--danger);border-color:var(--line);padding:5px 9px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bar h2{font-size:16px;margin:0}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td input{padding:6px}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}

select {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px;
    width: 100%;
}

select:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
}

</style>
</head>
<body>
<main>
  <h1>Client Follow-Up Tracker</h1>
  <p class="sub">Enter a client below.</p>

  <div class="card">
    
<form id="f">

    <label>
        Client Name
        <input
            type="text"
            name="name"
            required
            autocomplete="off"
        >
    </label>

    <label>
        Company
        <input
            type="text"
            name="company"
            required
            autocomplete="off"
        >
    </label>

    <label>
        Proposal Title
        <input
            type="text"
            name="proposaltitle"
            placeholder="Enter proposal title"
            autocomplete="off"
        >
    </label>

    <label>
        Proposal Status
        <select name="proposalstatus" required>
            <option value="">Select Status</option>
            <option value="Sent">Sent</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
            <option value="Pending">Pending</option>
        </select>
    </label>

    <label>
        First Follow Up
        <input type="date" name="f1">
    </label>

    <label>
        2nd Follow Up
        <input type="date" name="f2">
    </label>

    <label>
        3rd Follow Up
        <input type="date" name="f3">
    </label>

    <div style="align-content: right;" class="actions">
        <button type="submit">Add Client</button>
        <button type="reset" class="ghost">Clear</button>
    </div>

</form>

  </div>

  
<div class="card">

    <div class="bar">
        <h2>Clients (<span id="count">0</span>)</h2>
    </div>

    <div class="wrap">

        <table>

            <thead>
                <tr>
                    <th>Client Name</th>
                    <th>Company</th>
                    <th>Proposal Title</th>
                    <th>Proposal Status</th>
                    <th>First Follow Up</th>
                    <th>2nd Follow Up</th>
                    <th>3rd Follow Up</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="rows"></tbody>

        </table>

        <div id="empty" class="empty">
            No clients yet. Add your first one above.
        </div>

    </div>

</div>

</main>

</body>
</html>
