
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Client Follow-Up Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px 15px;
            color: #333;
        }

        .wrap {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        h2 {
            margin-top: 0;
        }

        .sub {
            color: #666;
            margin-top: 0;
        }

        .note {
            font-size: 13px;
            color: #666;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            margin-bottom: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }

        button {
            padding: 9px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .add-btn {
            background: #f5f5f5;
            color: black;
            margin-top: 17px;
        }

        .edit-btn {
            background: #f5f5f5;
            color: black;
        }

        .save-btn {
            background: #f5f5f5;
            color: #16a34a;
        }

        .cancel-btn {
            background: #f5f5f5;
            color: black;
        }

        .delete-btn {
            background: #f5f5f5;
            color: red;
        }

        /* RECORDS HEADER */

        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .records-header h2 {
            margin-bottom: 5px;
        }

        .records-header .note {
            margin-bottom: 0;
        }

        /* SEARCH AND FILTER */

        .filter-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            width: 250px;
            max-width: 100%;
        }

        .status-filter {
            width: 170px;
            max-width: 100%;
        }

        .search-box input,
        .status-filter select {
            width: 100%;
        }

        /* TABLE */

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1050px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            font-size: 13px;
            vertical-align: middle;
        }

        th {
            background: #f9fafb;
            font-weight: bold;
        }

        td input, td select {
            min-width: 110px;
        }

        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        #empty {
            text-align: center;
            color: #777;
            padding: 25px;
        }

        /* MOBILE */

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .card {
                padding: 15px;
            }

            .filter-controls {
                width: 100%;
            }

            .search-box,
            .status-filter {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="wrap">

    <h1>Client Follow-Up Tracker</h1>

    <p class="sub">
        Keep track of your clients and proposal follow-ups.
    </p>

    <p id="syncStatus" class="note">
        Connecting to database...
    </p>


    <!-- ================================== -->
    <!-- ADD CLIENT FORM -->
    <!-- ================================== -->

    <div class="card">

        <h2>Add New Client</h2>

        <form id="f">

            <div class="form-grid">

                <div>
                    <label for="name">Client Name *</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >
                </div>

                <div>
                    <label for="company">Company</label>
                    <input
                        type="text"
                        id="company"
                        name="company"
                    >
                </div>

                <div>
                    <label for="proposaltitle">Proposal Title</label>
                    <input
                        type="text"
                        id="proposaltitle"
                        name="proposaltitle"
                    >
                </div>

                <div>
                    <label for="proposalstatus">Proposal Status *</label>

                    <select
                        id="proposalstatus"
                        name="proposalstatus"
                        required
                    >
                        <option value="">Select Status</option>
                        <option value="Sent">Sent</option>
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>
                        <option value="Pending">Pending</option>
                    </select>
                </div>

                <div>
                    <label for="f1">First Follow-Up</label>
                    <input
                        type="date"
                        id="f1"
                        name="f1"
                    >
                </div>

                <div>
                    <label for="f2">Second Follow-Up</label>
                    <input
                        type="date"
                        id="f2"
                        name="f2"
                    >
                </div>

                <div>
                    <label for="f3">Third Follow-Up</label>
                    <input
                        type="date"
                        id="f3"
                        name="f3"
                    >
                </div>

            </div>

            <button type="submit" class="add-btn">
                Add Client
            </button>

        </form>

    </div>


    <!-- ================================== -->
    <!-- CLIENT RECORDS -->
    <!-- ================================== -->

    <div class="card">

        <div class="records-header">

            <div>
                <h2>Client Records</h2>

                <p class="note">
                    Total clients: <span id="count">0</span>
                    |
                    Showing: <span id="showing">0</span>
                </p>
            </div>

            <div class="filter-controls">

                <div class="search-box">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search clients..."
                    >
                </div>

                <div class="status-filter">
                    <select id="statusFilter">

                        <option value="">All Statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="Sent">Sent</option>
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>

                    </select>
                </div>

            </div>

        </div>


        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Client Name</th>
                        <th>Company</th>
                        <th>Proposal Title</th>
                        <th>Status</th>
                        <th>First Follow-Up</th>
                        <th>Second Follow-Up</th>
                        <th>Third Follow-Up</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="rows"></tbody>

            </table>

            <div id="empty">
                No client records found.
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
